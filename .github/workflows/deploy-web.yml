name: Deploy web to GitHub Pages

# Builds the Observable Framework site and deploys it to GitHub Pages. Runs on
# pushes that touch the site or the precompute outputs, and on demand. Enable
# Pages once under Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [claude/cool-brahmagupta-4zz1r1]
    paths:
      - "web/**"
      - "output/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          OBSERVABLE_TELEMETRY_DISABLE: "true"
          # Project page lives at https://benmsanderson.github.io/futureevent/
          PAGES_BASE: "/futureevent/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
